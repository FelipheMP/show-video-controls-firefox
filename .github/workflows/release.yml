name: Build and Release Extension

# Releases both packages from one source tree whenever the version in manifest.json
# changes on master:
#   - Firefox package: linted, built and submitted to Firefox Add-ons (AMO).
#   - Chromium package: built from the same source and attached to the GitHub
#     release; then published to Microsoft Edge Add-ons by the publish-edge job.
# A version that already has a tag is skipped, so re-running is safe.

on:
  push:
    branches:
      - master
    paths:
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: "Firefox Add-ons APIs"
    outputs:
      # "true" only when this run created a new release (used by publish-edge).
      released: ${{ steps.tag_check.outputs.exists == 'false' }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- Firefox -----

      - name: Install web-ext
        if: steps.tag_check.outputs.exists == 'false'
        run: npm install --global web-ext

      - name: Lint extension
        if: steps.tag_check.outputs.exists == 'false'
        run: web-ext lint

      - name: Build Firefox package
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          web-ext build \
            --overwrite-dest \
            --artifacts-dir web-ext-artifacts \
            --filename "auto-on-video-controls-firefox-${{ steps.version.outputs.version }}.zip"

      # ----- Chromium (Edge, Chrome) -----

      - name: Build Chromium package
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          node scripts/build-chromium.mjs

          mkdir -p web-ext-artifacts
          CHROMIUM_ZIP="web-ext-artifacts/auto-on-video-controls-chromium-${{ steps.version.outputs.version }}.zip"
          (cd dist/chromium && zip -r -X "$GITHUB_WORKSPACE/$CHROMIUM_ZIP" .)

      # Handed to the publish-edge job. Kept for a few days only: the release also holds it.
      - name: Keep Chromium package for the Edge job
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-package
          path: web-ext-artifacts/auto-on-video-controls-chromium-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      # ----- Publish and release -----

      - name: Submit to Firefox Add-ons
        if: steps.tag_check.outputs.exists == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          web-ext sign \
            --source-dir . \
            --channel listed \
            --no-input

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "web-ext-artifacts/auto-on-video-controls-firefox-$VERSION.zip" \
            "web-ext-artifacts/auto-on-video-controls-chromium-$VERSION.zip" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes

  # Publishes the Chromium package to Microsoft Edge Add-ons. It runs only after the
  # release job created a new release, and only when the repository variable
  # EDGE_PRODUCT_ID is set (Settings > Secrets and variables > Actions > Variables),
  # so the workflow still works before Edge publishing is configured.
  # Credentials live in the "Edge Add-ons APIs" environment: see store/README.md.
  publish-edge:
    needs: release
    if: needs.release.outputs.released == 'true' && vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-24.04
    environment: "Edge Add-ons APIs"
    permissions:
      contents: read

    steps:
      # Only the script is needed, not the whole history.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Chromium package
        uses: actions/download-artifact@v4
        with:
          name: chromium-package
          path: chromium-package

      - name: Upload and publish on Edge Add-ons
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: |
          node scripts/publish-edge.mjs \
            "chromium-package/auto-on-video-controls-chromium-${{ needs.release.outputs.version }}.zip" \
            --notes "Automated release v${{ needs.release.outputs.version }} from ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.version }}. No change to permissions or data handling."
